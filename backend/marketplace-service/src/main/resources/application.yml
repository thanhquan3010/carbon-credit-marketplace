server:
  port: 8084
  servlet:
    context-path: /api

spring:
  application:
    name: marketplace-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:marketplace_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          batch_versioned_data: true
    show-sql: false
    
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 60000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1
        
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 10s
    socket-timeout: 30s
    
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    
jwt:
  secret: ${JWT_SECRET:ThisIsASecretKeyForDevelopmentOnly-PleaseChangeInProduction}
  expiration: 86400000  # 24 hours
  refresh-expiration: 604800000  # 7 days

marketplace:
  listing:
    fixed-price:
      min-amount: 0.1  # tons
      max-amount: 100   # tons
      expiry-days: 90
    auction:
      min-amount: 1.0   # tons
      min-duration-days: 1
      max-duration-days: 30
      min-increment-vnd: 50000
      auto-extend-minutes: 10
      auto-extend-window-minutes: 5
    cart:
      reservation-minutes: 30
      max-items: 20
  fees:
    platform-percentage: 5  # 5% platform fee
    withdrawal-percentage: 2 # 2% withdrawal fee
  limits:
    daily-withdrawal-vnd: 50000000
    min-withdrawal-vnd: 500000
    
price-recommendation:
  cache-ttl-hours: 24
  min-historical-data: 10  # Minimum transactions for recommendation
  confidence-thresholds:
    high: 0.8
    medium: 0.6
    low: 0.4
    
websocket:
  message-broker:
    relay-host: ${STOMP_RELAY_HOST:localhost}
    relay-port: ${STOMP_RELAY_PORT:61613}
    client-login: ${STOMP_CLIENT_LOGIN:guest}
    client-passcode: ${STOMP_CLIENT_PASSCODE:guest}
  allowed-origins: "*"
  
logging:
  level:
    root: INFO
    com.carbonmarketplace.marketplaceservice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.elasticsearch.client: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: true
  packages-to-scan: com.carbonmarketplace.marketplaceservice

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
        
resilience4j:
  circuitbreaker:
    instances:
      carbon-credit-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      external-service:
        maxAttempts: 3
        waitDuration: 1000
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException

spring:
  application:
    name: transaction-service
  
  profiles:
    active: local
  
  datasource:
    url: jdbc:postgresql://localhost:5432/carbon_marketplace
    username: carbon_user
    password: carbon_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
  
  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
  
  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
  
  # Quartz Scheduler Configuration
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz:
        scheduler:
          instanceId: AUTO
          instanceName: TransactionServiceScheduler
        jobStore:
          driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
          tablePrefix: QRTZ_
          isClustered: true
          clusterCheckinInterval: 20000
        threadPool:
          threadCount: 10
  
  # Cloud Config
  cloud:
    config:
      enabled: false
      uri: http://localhost:8888
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 1000
        max-interval: 2000
        multiplier: 1.1

# Server Configuration
server:
  port: 8085
  servlet:
    context-path: /api/transactions
  error:
    include-message: always
    include-binding-errors: always
  
  # HTTP/2 Support
  http2:
    enabled: true
  
  # Compression
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 10
  instance:
    hostname: localhost
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    metadata-map:
      version: ${info.version}
      region: vietnam
      zone: hcm

# Feign Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: BASIC
  circuitbreaker:
    enabled: true
  compression:
    request:
      enabled: true
    response:
      enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      payment-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      carbon-credit-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
      certificate-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
  
  retry:
    instances:
      payment-service:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      carbon-credit-service:
        maxAttempts: 3
        waitDuration: 500ms
      certificate-service:
        maxAttempts: 2
        waitDuration: 1s
  
  bulkhead:
    instances:
      payment-service:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms
      carbon-credit-service:
        maxConcurrentCalls: 20
        maxWaitDuration: 50ms

# Security Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

# Transaction Service Specific Configuration
transaction:
  saga:
    timeout-seconds: 300 # 5 minutes for saga completion
    max-retry-attempts: 3
    compensation-timeout-seconds: 120
  
  escrow:
    hold-days: 2 # T+2 settlement
    auto-release-enabled: true
    release-schedule-cron: "0 0 2 * * ?" # Daily at 2 AM
  
  settlement:
    batch-size: 100
    processing-threads: 5
    t2-enabled: true
    cut-off-hour: 15 # 3 PM cut-off time
  
  refund:
    auto-approve-threshold-vnd: 1000000 # Auto-approve refunds under 1M VND
    approval-required-above: 10000000 # Manual approval for > 10M VND
    max-refund-days: 30
  
  fees:
    platform-percentage: 5.0 # 5% platform fee
    minimum-fee-vnd: 10000
    maximum-fee-vnd: 5000000
  
  limits:
    max-transaction-amount-vnd: 1000000000 # 1 billion VND
    min-transaction-amount-vnd: 100000 # 100K VND
    daily-transaction-limit-vnd: 5000000000 # 5 billion VND per user per day

# Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retry,bulkhead
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Logging Configuration
logging:
  level:
    root: INFO
    com.carbonmarketplace.transactionservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/transaction-service.log
    max-size: 10MB
    max-history: 30

# API Documentation
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# Application Info
info:
  app:
    name: Transaction Service
    description: Handles carbon credit transactions with saga pattern
    version: 1.0.0
    team: Carbon Marketplace Platform Team
